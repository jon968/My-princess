<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la persona más especial ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a4a4a;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .heart {
            font-size: 50px;
            color: #ff477e;
            animation: pulse 1.5s infinite;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            color: #ff477e;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff477e;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4);
            transition: background 0.3s;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            background-color: #ff7096;
        }

        /* Mensaje oculto que aparece al hacer clic */
        #secret-message {
            display: none;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #ffc2d1;
            font-style: italic;
            color: #ff477e;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Corazones flotando de fondo */
        .bg-heart {
            position: absolute;
            color: rgba(255, 71, 126, 0.2);
            font-size: 20px;
            animation: float 6s linear infinite;
            bottom: -20px;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>¡Hola, mi amor!</h1>
        <p>Hice esta pequeña página web solo para recordarte lo mucho que te amo y lo especial que eres para mí. Gracias por cada sonrisa y por estar a mi lado. 🌹</p>
        
        <button class="btn" onclick="revealMessage()">Haz clic aquí</button>
        
        <div id="secret-message">
            Eres mi lugar favorito en el mundo. ¡Te amo hoy, mañana y siempre! 🧭✨
        </div>
    </div>

    <script>
        function revealMessage() {
            const message = document.getElementById('secret-message');
            message.style.display = 'block';
            
            // Lanza un efecto extra de corazones al presionar el botón
            for(let i=0; i<10; i++) {
                createHeart();
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // Crear corazones lentos al cargar la página
        setInterval(createHeart, 800);
    </script>
</body>
</html>
